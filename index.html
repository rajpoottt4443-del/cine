<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineTogether - Watch Party & Live Chat</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #07090e; color: #f8fafc; overflow: hidden; }
        .glass-panel { background: rgba(19, 27, 46, 0.75); backdrop-filter: blur(16px); border: 1px solid rgba(181, 213, 237, 0.1); box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5); }
        .glass-input { background: rgba(7, 15, 30, 0.85); border: 1px solid rgba(57, 124, 184, 0.3); color: #ffffff; }
        .glass-input:focus { border-color: #397cb8; outline: none; box-shadow: 0 0 0 2px rgba(57, 124, 184, 0.25); }
        .btn-primary { background: linear-gradient(135deg, #102d55 0%, #397cb8 100%); border: 1px solid rgba(181, 213, 237, 0.3); box-shadow: 0 4px 14px rgba(57, 124, 184, 0.3); }
        .btn-primary:hover { background: linear-gradient(135deg, #163a6d 0%, #468ecf 100%); }
        ::-webkit-scrollbar { width: 5px; height: 5px; }
        ::-webkit-scrollbar-track { background: #07090e; }
        ::-webkit-scrollbar-thumb { background: #102d55; border-radius: 9999px; }
    </style>
</head>
<body class="h-screen flex flex-col">

    <!-- 1. AUTH SCREEN (Sign In / Sign Up) -->
    <div id="auth-screen" class="flex-1 flex items-center justify-center p-4 relative overflow-y-auto">
        <div class="glass-panel p-8 rounded-2xl w-full max-w-md space-y-5 my-auto">
            <div class="text-center space-y-2">
                <h2 class="text-2xl font-extrabold text-white">CineTogether</h2>
                <p class="text-xs text-slate-400">Watch party, screen share aur live chat ke liye sign in karein.</p>
            </div>

            <div class="flex bg-black/40 p-1 rounded-xl border border-white/10">
                <button onclick="switchTab('signin')" id="tab-signin-btn" class="flex-1 py-2 text-xs font-bold rounded-lg bg-[#397cb8] text-white transition">Sign In</button>
                <button onclick="switchTab('signup')" id="tab-signup-btn" class="flex-1 py-2 text-xs font-bold rounded-lg text-slate-400 transition">Sign Up</button>
            </div>

            <!-- SIGN IN FORM -->
            <div id="signin-form" class="space-y-3.5">
                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1">Email Address</label>
                    <input type="email" id="signin-email" placeholder="name@domain.com" class="w-full glass-input rounded-xl px-4 py-2.5 text-xs">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1">Password</label>
                    <div class="relative">
                        <input type="password" id="signin-password" placeholder="••••••••" class="w-full glass-input rounded-xl px-4 py-2.5 text-xs pr-10">
                        <button type="button" onclick="togglePassword('signin-password', 'signin-eye')" class="absolute right-3 top-2.5 text-xs text-slate-400 hover:text-white font-mono" id="signin-eye">Show</button>
                    </div>
                </div>
                <button onclick="handleSignIn()" class="w-full btn-primary text-white font-bold py-3 rounded-xl text-xs uppercase">Sign In</button>
            </div>

            <!-- SIGN UP FORM -->
            <div id="signup-form" class="space-y-3.5 hidden">
                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1">Email Address</label>
                    <input type="email" id="signup-email" placeholder="name@domain.com" class="w-full glass-input rounded-xl px-4 py-2.5 text-xs">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1">Password</label>
                    <div class="relative">
                        <input type="password" id="signup-password" placeholder="••••••••" class="w-full glass-input rounded-xl px-4 py-2.5 text-xs pr-10">
                        <button type="button" onclick="togglePassword('signup-password', 'signup-eye')" class="absolute right-3 top-2.5 text-xs text-slate-400 hover:text-white font-mono" id="signup-eye">Show</button>
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1">Verify Password (Confirm)</label>
                    <div class="relative">
                        <input type="password" id="signup-confirm-password" placeholder="••••••••" class="w-full glass-input rounded-xl px-4 py-2.5 text-xs pr-10">
                        <button type="button" onclick="togglePassword('signup-confirm-password', 'signup-confirm-eye')" class="absolute right-3 top-2.5 text-xs text-slate-400 hover:text-white font-mono" id="signup-confirm-eye">Show</button>
                    </div>
                </div>
                <button onclick="handleSignUp()" class="w-full btn-primary text-white font-bold py-3 rounded-xl text-xs uppercase">Create Account (Sign Up)</button>
            </div>
        </div>
    </div>

    <!-- 2. LOBBY SCREEN -->
    <div id="lobby-screen" class="flex-1 hidden flex-col items-center justify-center p-4">
        <div class="glass-panel p-8 rounded-2xl w-full max-w-lg space-y-6">
            <div class="flex items-center justify-between border-b border-white/10 pb-4">
                <div>
                    <h3 class="text-lg font-bold text-white" id="welcome-user">Welcome</h3>
                    <p class="text-xs font-mono text-[#b5d5ed]" id="user-email-display">Supabase Connected</p>
                </div>
                <button onclick="handleLogout()" class="text-xs text-red-400 hover:underline font-semibold">Logout</button>
            </div>
            <div class="space-y-4">
                <div class="bg-black/40 p-5 rounded-xl border border-white/5 space-y-3">
                    <h4 class="text-xs font-bold text-[#b5d5ed] uppercase">Naya Watch Party Room Banayein</h4>
                    <input type="text" id="room-title-input" placeholder="Room Title (e.g. Movie Night)" class="w-full glass-input rounded-lg px-3.5 py-2.5 text-xs">
                    <button onclick="createRoom()" class="w-full btn-primary text-white font-bold py-2.5 rounded-lg text-xs">Create Room & Start Movie</button>
                </div>
                <div class="bg-black/40 p-5 rounded-xl border border-white/5 space-y-3">
                    <h4 class="text-xs font-bold text-[#b5d5ed] uppercase">Room Code Se Join Karein</h4>
                    <input type="text" id="join-code-input" placeholder="e.g. CINE-4029" class="w-full glass-input rounded-lg px-3.5 py-2.5 text-xs font-mono uppercase">
                    <button onclick="joinRoom()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-semibold py-2.5 rounded-lg text-xs">Join Room</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 3. ROOM SCREEN (Movie Player + Screen Share + Live Chat) -->
    <div id="room-screen" class="flex-1 hidden flex-col lg:flex-row overflow-hidden">
        
        <!-- Left: Movie Theater & Screen Share -->
        <div class="flex-1 flex flex-col p-4 space-y-3 overflow-y-auto">
            <div class="flex items-center justify-between glass-panel px-4 py-3 rounded-xl">
                <div class="flex items-center gap-3">
                    <span class="w-2.5 h-2.5 rounded-full bg-cyan-400 animate-pulse"></span>
                    <h3 id="room-name-display" class="font-bold text-sm text-white">Room</h3>
                    <span class="bg-black/60 px-2.5 py-0.5 rounded text-xs font-mono text-[#b5d5ed]" id="room-code-display">CINE-0000</span>
                </div>
                <div class="flex items-center gap-2">
                    <button onclick="toggleScreenShare()" id="screen-share-btn" class="btn-primary text-xs px-3.5 py-2 rounded-lg font-semibold">Screen Share (Audio On)</button>
                    <button onclick="leaveRoom()" class="bg-red-500/20 text-red-300 text-xs px-3 py-2 rounded-lg font-semibold border border-red-500/30">Leave Room</button>
                </div>
            </div>

            <!-- Screen Share Preview -->
            <div id="screenshare-box" class="hidden bg-black rounded-xl overflow-hidden border border-white/10 aspect-video flex items-center justify-center relative">
                <video id="screenshare-video" autoplay playsinline class="w-full h-full object-contain"></video>
            </div>

            <!-- Main Movie Player -->
            <div class="bg-black rounded-xl overflow-hidden border border-white/10 aspect-video relative flex items-center justify-center shadow-2xl">
                <video id="movie-player" src="https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/TearsOfSteel.mp4" controls class="w-full h-full object-contain"></video>
            </div>
        </div>

        <!-- Right: Real-Time Live Chat Sidebar -->
        <div class="w-full lg:w-80 glass-panel border-t lg:border-t-0 lg:border-l border-white/10 flex flex-col h-72 lg:h-auto">
            <div class="p-3.5 border-b border-white/10 flex items-center justify-between">
                <span class="text-xs font-bold uppercase tracking-wider text-slate-300">Room Live Chat</span>
                <span class="text-[11px] text-cyan-300 font-mono">Supabase Realtime</span>
            </div>

            <div id="chat-messages-container" class="flex-1 p-3 overflow-y-auto space-y-2.5 text-xs">
                <!-- Chat messages will load here -->
            </div>

            <div class="p-3 border-t border-white/10 bg-black/40 flex gap-2">
                <input type="text" id="chat-input" placeholder="Kuch likhein..." class="flex-1 glass-input rounded-lg px-3 py-2 text-xs" onkeypress="if(event.key === 'Enter') sendChatMessage()">
                <button onclick="sendChatMessage()" class="btn-primary px-4 py-2 rounded-lg text-xs font-semibold">Bhejein</button>
            </div>
        </div>

    </div>

    <!-- MAIN SCRIPT -->
    <script type="module">
        import { supabase } from './supabase.js';

        let currentUser = null;
        let currentRoom = null;
        let localScreenStream = null;
        let chatSubscription = null;

        window.switchTab = function(tab) {
            const signinForm = document.getElementById('signin-form');
            const signupForm = document.getElementById('signup-form');
            const signinBtn = document.getElementById('tab-signin-btn');
            const signupBtn = document.getElementById('tab-signup-btn');

            if (tab === 'signin') {
                signinForm.style.display = 'block';
                signupForm.style.display = 'none';
                signinBtn.className = 'flex-1 py-2 text-xs font-bold rounded-lg bg-[#397cb8] text-white transition';
                signupBtn.className = 'flex-1 py-2 text-xs font-bold rounded-lg text-slate-400 transition';
            } else {
                signinForm.style.display = 'none';
                signupForm.style.display = 'block';
                signupBtn.className = 'flex-1 py-2 text-xs font-bold rounded-lg text-slate-400 transition';
                signinBtn.className = 'flex-1 py-2 text-xs font-bold rounded-lg bg-[#397cb8] text-white transition';
            }
        };

        window.togglePassword = function(inputId, btnId) {
            const input = document.getElementById(inputId);
            const btn = document.getElementById(btnId);
            if (input.type === 'password') {
                input.type = 'text';
                btn.innerText = 'Hide';
            } else {
                input.type = 'password';
                btn.innerText = 'Show';
            }
        };

        window.handleSignIn = async function() {
            const email = document.getElementById('signin-email').value.trim();
            const password = document.getElementById('signin-password').value.trim();
            if (!email || !password) { alert('Email aur password likhein!'); return; }

            let { data, error } = await supabase.auth.signInWithPassword({ email, password });
            if (error) {
                alert('Login Error: ' + error.message);
                return;
            }
            currentUser = data.user;
            showLobby();
        };

        window.handleSignUp = async function() {
            const email = document.getElementById('signup-email').value.trim();
            const password = document.getElementById('signup-password').value.trim();
            const confirmPassword = document.getElementById('signup-confirm-password').value.trim();

            if (!email || !password || !confirmPassword) { alert('Sabhi fields bharein!'); return; }
            if (password !== confirmPassword) { alert('Password match nahi kar rahe!'); return; }

            let { data, error } = await supabase.auth.signUp({ email, password });
            if (error) {
                alert('Sign Up Error: ' + error.message);
                return;
            }
            currentUser = data.user;
            alert('Account successfully ban gaya aur login ho gaya!');
            showLobby();
        };

        window.handleLogout = async function() {
            await supabase.auth.signOut();
            currentUser = null;
            currentRoom = null;
            document.getElementById('auth-screen').style.display = 'flex';
            document.getElementById('lobby-screen').style.display = 'none';
            document.getElementById('room-screen').style.display = 'none';
        };

        function showLobby() {
            document.getElementById('auth-screen').style.display = 'none';
            document.getElementById('lobby-screen').style.display = 'flex';
            document.getElementById('welcome-user').innerText = `User: ${currentUser.email}`;
        }

        window.createRoom = async function() {
            const title = document.getElementById('room-title-input').value.trim() || 'Watch Party';
            const room_code = 'CINE-' + Math.floor(1000 + Math.random() * 9000);

            let { data, error } = await supabase.from('rooms').insert([
                { room_code, name: title, host_id: currentUser.id, is_playing: false, playback_position: 0 }
            ]).select();

            if (error) { alert('Room creation error: ' + error.message); return; }
            currentRoom = data[0];
            showRoom();
        };

        window.joinRoom = async function() {
            const code = document.getElementById('join-code-input').value.trim().toUpperCase();
            if (!code) { alert('Room code likhein!'); return; }

            let { data, error } = await supabase.from('rooms').select('*').eq('room_code', code).single();
            if (error || !data) { alert('Room nahi mila!'); return; }
            currentRoom = data;
            showRoom();
        };

        function showRoom() {
            document.getElementById('auth-screen').style.display = 'none';
            document.getElementById('lobby-screen').style.display = 'none';
            document.getElementById('room-screen').style.display = 'flex';
            document.getElementById('room-name-display').innerText = currentRoom.name;
            document.getElementById('room-code-display').innerText = currentRoom.room_code;
            loadMessages();
            subscribeToChat();
        }

        window.leaveRoom = function() {
            if (chatSubscription) { supabase.removeChannel(chatSubscription); }
            currentRoom = null;
            showLobby();
        };

        // --- REAL-TIME CHAT FUNCTIONS ---
        window.sendChatMessage = async function() {
            const input = document.getElementById('chat-input');
            const text = input.value.trim();
            if (!text || !currentRoom || !currentUser) return;

            let { error } = await supabase.from('messages').insert([
                {
                    room_code: currentRoom.room_code,
                    user_name: currentUser.email.split('@')[0],
                    message: text
                }
            ]);

            if (error) {
                alert('Message send error: ' + error.message);
                return;
            }
            input.value = '';
        };

        async function loadMessages() {
            const container = document.getElementById('chat-messages-container');
            let { data, error } = await supabase
                .from('messages')
                .select('*')
                .eq('room_code', currentRoom.room_code)
                .order('created_at', { ascending: true });

            if (error) { return; }

            container.innerHTML = '';
            data.forEach(m => {
                appendMessageToUI(m);
            });
            container.scrollTop = container.scrollHeight;
        }

        function subscribeToChat() {
            chatSubscription = supabase
                .channel('room-chat-' + currentRoom.room_code)
                .on('postgres_changes', {
                    event: 'INSERT',
                    schema: 'public',
                    table: 'messages',
                    filter: `room_code=eq.${currentRoom.room_code}`
                }, payload => {
                    appendMessageToUI(payload.new);
                })
                .subscribe();
        }

        function appendMessageToUI(m) {
            const container = document.getElementById('chat-messages-container');
            const isMe = m.user_name === currentUser.email.split('@')[0];
            const div = document.createElement('div');
            div.className = `flex flex-col ${isMe ? 'items-end' : 'items-start'}`;
            div.innerHTML = `
                <span class="text-[9px] text-slate-400 mb-0.5">${m.user_name}</span>
                <div class="px-3 py-1.5 rounded-xl text-xs max-w-[85%] ${isMe ? 'bg-[#397cb8] text-white' : 'bg-slate-800 text-slate-200 border border-white/5'}">${m.message}</div>
            `;
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
        }

        // --- SCREEN SHARE WITH AUDIO ---
        window.toggleScreenShare = async function() {
            const videoEl = document.getElementById('screenshare-video');
            const boxEl = document.getElementById('screenshare-box');
            if (!localScreenStream) {
                try {
                    localScreenStream = await navigator.mediaDevices.getDisplayMedia({ video: true, audio: true });
                    videoEl.srcObject = localScreenStream;
                    boxEl.classList.remove('hidden');
                } catch (e) { alert('Screen share cancel ho gayi.'); }
            } else {
                localScreenStream.getTracks().forEach(t => t.stop());
                localScreenStream = null;
                boxEl.classList.add('hidden');
            }
        };
    </script>
</body>
</html>
