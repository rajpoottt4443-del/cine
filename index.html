<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SimpleChat & ScreenShare</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white h-screen flex flex-col">

    <!-- AUTH SECTION (WhatsApp Style Account Creation) -->
    <div id="auth-screen" class="flex-1 flex items-center justify-center p-4">
        <div class="bg-slate-800 p-8 rounded-2xl shadow-xl w-full max-w-md space-y-4 border border-slate-700">
            <h2 class="text-2xl font-bold text-center text-emerald-400">WhatsApp Style App</h2>
            <p class="text-xs text-slate-400 text-center">Pehle apna account banayein ya sign in karein.</p>
            <input type="text" id="username-input" placeholder="Apna Naam Likhein (e.g. Ali)" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-sm focus:outline-none focus:border-emerald-500">
            <button onclick="handleLogin()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-semibold py-3 rounded-lg transition">Account Banayein & Shuru Karein</button>
        </div>
    </div>

    <!-- MAIN CHAT & SCREEN SHARE DASHBOARD -->
    <div id="app-screen" class="flex-1 flex hidden overflow-hidden">
        <!-- Sidebar / Chat List -->
        <div class="w-1/3 bg-slate-800 border-r border-slate-700 flex flex-col">
            <div class="p-4 border-b border-slate-700 flex items-center justify-between">
                <span id="current-user-display" class="font-bold text-emerald-400 text-sm"></span>
                <button onclick="handleLogout()" class="text-xs text-red-400 hover:underline">Logout</button>
            </div>
            <div class="p-3 bg-slate-850 text-xs text-slate-400 font-semibold uppercase">Global Chat Room</div>
            <div class="flex-1 p-3 overflow-y-auto space-y-2">
                <div class="p-2.5 rounded-lg bg-slate-700/50 text-sm cursor-pointer flex items-center justify-between">
                    <span>General Community Room</span>
                    <span class="w-2 h-2 rounded-full bg-emerald-500"></span>
                </div>
            </div>
        </div>

        <!-- Chat & Screen Share Stage -->
        <div class="flex-1 flex flex-col bg-slate-900">
            <!-- Top Bar -->
            <div class="p-4 bg-slate-800 border-b border-slate-700 flex items-center justify-between">
                <h3 class="font-bold text-sm">General Room & Screen Share</h3>
                <button onclick="toggleScreenShare()" id="share-btn" class="bg-indigo-600 hover:bg-indigo-500 text-xs px-4 py-2 rounded-lg font-semibold transition">Screen Share Shuru Karein</button>
            </div>

            <!-- Screen Share Viewport -->
            <div id="screen-container" class="hidden bg-black p-2 border-b border-slate-700 flex justify-center items-center h-48 relative">
                <video id="screen-video" autoplay playsinline class="max-h-full rounded"></video>
            </div>

            <!-- Messages Box -->
            <div id="chat-messages" class="flex-1 p-4 overflow-y-auto space-y-3 text-sm">
                <!-- Messages will appear here -->
            </div>

            <!-- Message Input Box -->
            <div class="p-3 bg-slate-800 border-t border-slate-700 flex gap-2">
                <input type="text" id="message-input" placeholder="Message likhein..." class="flex-1 bg-slate-900 border border-slate-700 rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:border-emerald-500" onkeypress="if(event.key === 'Enter') sendMessage()">
                <button onclick="sendMessage()" class="bg-emerald-600 hover:bg-emerald-500 px-5 py-2.5 rounded-lg text-sm font-semibold transition">Bhejein</button>
            </div>
        </div>
    </div>

    <script>
        let currentUser = localStorage.getItem('chat_username') || '';
        let localStream = null;

        window.onload = function() {
            if (currentUser) {
                showAppScreen();
            }
        };

        function handleLogin() {
            const name = document.getElementById('username-input').value.trim();
            if (!name) {
                alert('Kripya apna naam darj karein!');
                return;
            }
            currentUser = name;
            localStorage.setItem('chat_username', currentUser);
            showAppScreen();
        }

        function handleLogout() {
            localStorage.removeItem('chat_username');
            currentUser = '';
            location.reload();
        }

        function showAppScreen() {
            document.getElementById('auth-screen').classList.add('hidden');
            document.getElementById('app-screen').classList.remove('hidden');
            document.getElementById('current-user-display').innerText = `User: ${currentUser}`;
            loadMessages();
        }

        function sendMessage() {
            const input = document.getElementById('message-input');
            const text = input.value.trim();
            if (!text) return;

            const messages = JSON.parse(localStorage.getItem('chat_msgs') || '[]');
            const newMsg = { user: currentUser, text: text, time: new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) };
            messages.push(newMsg);
            localStorage.setItem('chat_msgs', JSON.stringify(messages));
            input.value = '';
            loadMessages();
        }

        function loadMessages() {
            const container = document.getElementById('chat-messages');
            const messages = JSON.parse(localStorage.getItem('chat_msgs') || '[]');
            container.innerHTML = '';
            
            messages.forEach(msg => {
                const div = document.createElement('div');
                const isMe = msg.user === currentUser;
                div.className = `flex flex-col ${isMe ? 'items-end' : 'items-start'} space-y-1`;
                div.innerHTML = `
                    <span class="text-[10px] text-slate-400">${msg.user} • ${msg.time}</span>
                    <div class="px-4 py-2 rounded-xl text-xs max-w-xs ${isMe ? 'bg-emerald-600 text-white' : 'bg-slate-800 text-slate-200 border border-slate-700'}">${msg.text}</div>
                `;
                container.appendChild(div);
            });
            container.scrollTop = container.scrollHeight;
        }

        // Native WebRTC Screen Share Functionality
        async function toggleScreenShare() {
            const videoEl = document.getElementById('screen-video');
            const containerEl = document.getElementById('screen-container');
            const btn = document.getElementById('share-btn');

            if (!localStream) {
                try {
                    localStream = await navigator.mediaDevices.getDisplayMedia({ video: true, audio: true });
                    videoEl.srcObject = localStream;
                    containerEl.classList.remove('hidden');
                    btn.innerText = 'Screen Share Band Karein';
                    btn.className = 'bg-red-600 hover:bg-red-500 text-xs px-4 py-2 rounded-lg font-semibold transition';

                    localStream.getVideoTracks()[0].onended = function() {
                        stopScreenShare();
                    };
                } catch (err) {
                    alert('Screen share cancel kar diya gaya ya support nahi mila.');
                }
            } else {
                stopScreenShare();
            }
        }

        function stopScreenShare() {
            if (localStream) {
                localStream.getTracks().forEach(track => track.stop());
                localStream = null;
            }
            document.getElementById('screen-container').classList.add('hidden');
            const btn = document.getElementById('share-btn');
            btn.innerText = 'Screen Share Shuru Karein';
            btn.className = 'bg-indigo-600 hover:bg-indigo-500 text-xs px-4 py-2 rounded-lg font-semibold transition';
        }

        // Auto refresh messages every 1 second for simulation
        setInterval(() => {
            if (currentUser) loadMessages();
        }, 1000);
    </script>
</body>
</html>
